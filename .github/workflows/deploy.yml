name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Checkout BowlDesigner
        uses: actions/checkout@v4
        with:
          repository: ericdf/BowlDesigner
          path: BowlDesigner

      - name: Build Bowl Designer web app
        working-directory: BowlDesigner/web
        run: |
          npm ci
          npm run build

      - name: Copy Bowl Designer into site
        run: |
          rm -rf _site/bowl_designer
          cp -r BowlDesigner/web/dist _site/bowl_designer

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
