<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Bowl Designer">
  <!-- Top-down segmented ring. The 3/4 bowl of the app icon loses its
       segment joints below about 32px; seen from above the alternating
       staves stay legible down to 16px. Palette sampled from AppIcon:
       cream ground, walnut and terracotta staves. -->
  <rect width="48" height="48" rx="10" fill="#f7eeda"/>

  <g transform="translate(24 24)">
    <!-- 12 staves as full pie wedges; the ring is cut out of them below. -->
    <g fill="#54311f">
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(60)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(120)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(180)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(240)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(300)"/>
    </g>
    <g fill="#a7603a">
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(30)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(90)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(150)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(210)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(270)"/>
      <path d="M0 0 L19.5 -5.23 L19.5 5.23 Z" transform="rotate(330)"/>
    </g>

    <!-- Round the outside back to a circle, then knock out the bore. -->
    <circle r="21.4" fill="none" stroke="#f7eeda" stroke-width="6"/>
    <circle r="9.4" fill="#f7eeda"/>

    <!-- Edges, kept light so they read as joints rather than outlines. -->
    <circle r="18.4" fill="none" stroke="#54311f" stroke-width="1" opacity="0.4"/>
    <circle r="9.4"  fill="none" stroke="#54311f" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
