    <!-- The app name, and NOTHING else (CLAUDE.md §13: the user-visible name
         is Bowl Designer everywhere).

         It read "Bowl Designer — plan and build turned bowls", and a narrow
         tab showed only the tail: a tab labelled "turned bowls", naming a
         subject rather than this application. Trimming to "Bowl Designer™"
         then truncated from the LEFT and read "Designer™" — the tab clips
         whichever end it likes, so the only title that survives is one short
         enough not to clip. The descriptive half lives in the meta
         description, where search results and link previews read it. -->
    <title>Bowl Designer</title>
    <meta name="application-name" content="Bowl Designer" />
    <meta name="apple-mobile-web-app-title" content="Bowl Designer" />
    <meta name="description" content="A free browser tool for designing turned wood bowls — segmented or from a solid blank. Plan the profile, rings and species, check the geometry, and print a shop plan with true-scale segment templates. Nothing to install, no account." />

    <!-- Shared links show the tool, not a bare URL. -->
    <meta property="og:title" content="Bowl Designer" />
    <meta property="og:description" content="Design a turned bowl in the browser — segmented or from a solid blank — and print the shop plan. Free, no account." />
